<style>
:root{--p:#0f766e;--p2:#14b8a6;--pl:#ccfbf1;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f4f7f6;--card:#fff;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--blue:#0ea5e9;--vio:#8b5cf6;--gold:#d4a017;--silver:#94a3b8;--bronze:#b87333;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#app{display:flex;height:100vh}
#side{width:210px;background:#0b3b37;color:#d7f5ef;display:flex;flex-direction:column;flex-shrink:0}
.logo{margin:14px 12px 6px;padding:12px 12px 8px;background:#fff;border-radius:12px;text-align:center}.logo img{width:100%;max-width:170px;display:block;margin:0 auto}.logo small{display:block;font-size:10.5px;color:#0f766e;margin-top:4px;letter-spacing:.3px}
.logo b{font-size:16px;color:#fff;display:block;letter-spacing:.2px}.logo small{font-size:11px;opacity:.7}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--p2);display:grid;place-items:center}
#nav{padding:10px 8px;flex:1;overflow:auto}
#nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;padding:10px 12px;border-radius:10px;text-align:left;opacity:.85}
#nav button:hover{background:rgba(255,255,255,.07);opacity:1}
#nav button.on{background:var(--p2);color:#032a26;opacity:1;font-weight:600}
#nav .cnt{margin-left:auto;background:#f59e0b;color:#3a2400;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.sidefoot{padding:12px 16px;font-size:11px;opacity:.6;line-height:1.5}
#wrap{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line)}
#top h1{font-size:19px;margin:0;margin-right:auto}
#q{width:260px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--p2)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.pri:hover{background:#0c5f59}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.wa{background:#22c55e;border-color:#22c55e;color:#fff}
.btn.dang{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#banner:empty{display:none}
#banner{background:#fff7e6;border-bottom:1px solid #fde3a7;padding:8px 22px;font-size:13px;display:flex;gap:10px;align-items:center}
#main{flex:1;overflow:auto;padding:22px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1200px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:400}
.kpi{position:relative;overflow:hidden}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:26px;font-weight:700;margin:6px 0 2px}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi .ic{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:#f1f5f9;color:#334155;margin:1px}
.hb{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.hb .lb{width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{flex:1;background:#eef2f1;border-radius:6px;height:14px;overflow:hidden}
.hb .fi{height:100%;border-radius:6px}
.hb .nv{width:90px;text-align:right;font-variant-numeric:tabular-nums}
.funnel .st{margin:0 auto 6px;color:#fff;border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;min-width:150px}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.t td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.t tr.cl:hover td{background:#f8fffd;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
/* kanban */
.kb{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:10px;min-height:60vh}
.col{background:#eaf0ef;border-radius:var(--r);width:260px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 260px)}
.col.over{outline:2px dashed var(--p2);background:#ddf6f1}
.colh{padding:12px 12px 8px;border-top:4px solid;border-radius:var(--r) var(--r) 0 0}
.colh b{font-size:13px}.colh .mut{font-size:11px}
.colb{padding:6px 8px 10px;overflow:auto;flex:1;min-height:60px}
.oc{background:#fff;border-radius:10px;padding:10px 11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.07);border:1px solid #e8eeec;cursor:grab}
.oc:active{cursor:grabbing}.oc.drag{opacity:.4}
.oc .nm{font-weight:600;font-size:13px}.oc .vl{font-weight:700;color:var(--p)}
.oc .ft{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.hidden{display:none!important}
.mbox{background:#fff;border-radius:16px;width:560px;max-width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox.wide{width:900px}
.mbox h2{margin:0 0 14px;font-size:18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fg .f1{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
label.f input,label.f select,label.f textarea,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:14px}
textarea{resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;align-items:center}
.tst{background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:520px}
.tst.err{background:var(--bad)}.tst.ok{background:var(--p)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 12px}
.tabs button{background:none;border:0;padding:8px 12px;border-bottom:2px solid transparent;color:var(--mut)}
.tabs button.on{border-color:var(--p);color:var(--ink);font-weight:600}
.stars{color:#e2e8f0;font-size:17px;letter-spacing:1px;user-select:none}.stars i{font-style:normal;cursor:pointer}.stars i.on{color:#f5b301}
.drop{border:2px dashed #b7d9d3;border-radius:var(--r);padding:34px;text-align:center;background:#fbfefd;cursor:pointer}
.drop.over{background:#e6faf6;border-color:var(--p2)}
.heat td{width:18%;text-align:center;border-radius:8px;padding:12px 4px;font-weight:700;cursor:pointer;border:3px solid #fff}
.heat th{font-size:11px;color:var(--mut);font-weight:500;padding:4px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;margin-bottom:12px}.tl .it:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--p2)}
.rc{display:flex;gap:14px;align-items:center}
.seg{display:inline-flex;background:#e9efee;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-size:12px;color:#334155}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600;color:var(--ink)}
.empty{padding:40px;text-align:center;color:var(--mut)}
.pill{padding:3px 9px;border-radius:20px;font-size:12px;background:var(--pl);color:#064e48;font-weight:600}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px}.legend span{display:flex;gap:6px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.camp{border-top:5px solid var(--p2)}
a{color:var(--p)}
#bnav,.mo{display:none}
a.btn{text-decoration:none}
.t td.num{white-space:nowrap}
.mc{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.mc .nm{font-weight:700}
#mlogo{background:#fff;border-radius:10px;padding:3px 8px;height:38px;align-items:center;flex-shrink:0}#mlogo img{height:32px;width:auto;display:block}
.mhead{font-size:13px;color:var(--mut);margin:14px 2px 6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mlist button{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;text-align:left;font-size:15px}
#wlogin{position:fixed;inset:0;background:linear-gradient(160deg,#0b3b37,#0f766e);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
#wlogin .box{background:#fff;border-radius:18px;padding:24px 20px;width:360px;max-width:100%;text-align:center}
#wlogin img{max-width:190px;width:70%}
#wlogin input{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:12px;font-size:17px;margin:14px 0 10px;text-align:center}
@media(max-width:760px){
 html,body{font-size:15px}
 #app{height:100vh;height:100dvh}
 #side,.dk{display:none!important}
 .mo{display:flex}
 #top{flex-wrap:wrap;padding:10px 12px;gap:8px;background:var(--p);border-bottom:0}
 #top h1{color:#fff;font-size:17px;flex:1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #top .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;min-height:38px;padding:6px 12px}
 #q{order:9;width:100%;flex-basis:100%;background:#fff;border:0;padding:11px 12px;font-size:15px}
 #banner{padding:8px 12px;font-size:12px;flex-wrap:wrap}
 #main{padding:12px 12px 92px}
 .grid{gap:10px}
 .g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g3,.g2,.grid[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}
 .fg{grid-template-columns:1fr}
 .card{padding:12px;overflow-x:auto}
 .kpi .v{font-size:20px}.kpi .ic{width:30px;height:30px;right:10px;top:10px}
 .t{min-width:600px}
 .ov{padding:0}
 .mbox,.mbox.wide{width:100%;min-height:100%;border-radius:0;padding:16px 14px 40px;overflow-x:auto}
 .mfoot{position:sticky;bottom:0;background:#fff;padding:10px 0;margin-top:12px;flex-wrap:wrap}
 .tabs{overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}
 .seg{overflow-x:auto;flex-wrap:nowrap;max-width:100%}.seg button{white-space:nowrap}
 .kb{min-height:0}.col{width:84vw;max-height:none}
 .btn{min-height:40px}.btn.sm{min-height:36px;padding:6px 11px}
 label.f input,label.f select,label.f textarea,.inp{font-size:16px;padding:10px}
 .row>.inp,.row>select.inp{flex:1 1 45%;min-width:0}
 .hb .lb{width:92px}.hb .nv{width:72px}
 #toast{bottom:84px;width:92%}
 #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:45;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 #bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 0;position:relative}
 #bnav button.on{color:var(--p);font-weight:700}
 #bnav .cnt{position:absolute;top:0;right:22%;background:#f59e0b;color:#3a2400;border-radius:20px;font-size:10px;padding:0 6px;font-weight:700}
 .ov{z-index:50}
}
</style>
</head>

<script>
'use strict';
const CRM_VER='v19.1 · 18 nov 2026';   // ← versión visible en la app (barra lateral, Más y pantalla de clave)
/* =================== CONSTANTES =================== */

const STAGES=[

const CSCOL={Pendiente:'#cbd5e1',Contactado:'#38bdf8',Respondió:'#8b5cf6',Cotizado:'#f59e0b',Ganado:'#16a34a',Perdido:'#ef4444',Salió:'#475569'};
const LEVELS={Oro:'#d4a017',Plata:'#94a3b8',Bronce:'#b87333',Básico:'#cbd5e1',Prospecto:'#e2e8f0'};
const STATUS={Activo:'#16a34a','Por vencer':'#f59e0b','Toca recompra':'#ef4444',Dormido:'#475569',Prospecto:'#94a3b8'};
const TPL_RECOMPRA='Hola {nombre}, te saludamos de Home Detox. Ya pasaron {meses} meses desde el último detox de {servicios}. Con el uso diario se vuelven a acumular ácaros, polvo y bacterias que no se ven, por eso recomendamos repetirlo cada 6 meses. ¿Quieres que te ayudemos a agendar? Mándanos una foto y te cotizamos. Si prefieres no recibir más mensajes, responde SALIR.';
const TPL_SEGUIMIENTO='Hola {nombre}, ¿cómo vas? Te escribo para saber si pudiste revisar la cotización de {titulo}. Si quieres, te ayudo a buscar un espacio en la agenda de esta semana.';

/* =================== UTILIDADES =================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const D=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const daysDiff=(a,b)=>Math.round((D(b)-D(a))/864e5);
const monthsDiff=(a,b)=>{const x=D(a),y=D(b);return (y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth())-(y.getDate()<x.getDate()?1:0)};
const addMonths=(s,n)=>{const d=D(s);return ymd(new Date(d.getFullYear(),d.getMonth()+n,d.getDate()))};
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return ymd(d)};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fd=s=>{if(!s)return '—';const d=D(s);return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear()};
const fds=s=>{if(!s)return '—';const d=D(s);return d.getDate()+' '+MES[d.getMonth()]};
const money=v=>'$ '+Math.round(+v||0).toLocaleString('es-CO');
const kmoney=v=>{v=+v||0;if(v>=1e6)return '$'+(v/1e6).toFixed(v>=1e7?0:1).replace('.',',')+' M';if(v>=1e3)return '$'+Math.round(v/1e3)+' mil';return '$'+v};
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const normPhone=p=>{const d=String(p??'').replace(/\D/g,'');return d.length>=7?d.slice(-10):''};
const titleCase=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\s(De|Del|La|Las|Los|Y)\s/g,m=>m.toLowerCase());
const first=n=>String(n||'').split(' ')[0]||'';
const normName=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[\/(]| - /)[0].replace(/[^a-zñ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const countsAsService=s=>s.date<=today()&&(DB.settings.formAsService||!(s.source==='formulario'||s.source==='lista'));
const nowISO=()=>new Date().toISOString();

/* Festivos de Colombia (Ley Emiliani) para validar Ley 2300 */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const HOLI={};
function holidays(y){if(HOLI[y])return HOLI[y];const s=new Set();const add=d=>s.add(ymd(d));const mon=d=>{while(d.getDay()!==1)d.setDate(d.getDate()+1);return d};
 [[0,1],[4,1],[6,20],[7,7],[11,8],[11,25]].forEach(([m,d])=>add(new Date(y,m,d)));
 [[0,6],[2,19],[5,29],[7,15],[9,12],[10,1],[10,11]].forEach(([m,d])=>add(mon(new Date(y,m,d))));

function rBucket(m){return m<6?0:m<12?1:m<24?2:m<48?3:4}
function renderRecompra(){const S=stats(),cs=DB.contacts.filter(c=>S[c.id].n&&!c.optOut),t=today();
 const RB=['0-6 m','6-12 m','1-2 años','2-4 años','+4 años'],FB=['5+','4','3','2','1'];
 const grid=FB.map(()=>RB.map(()=>0));cs.forEach(c=>{const s=S[c.id];grid[5-Math.min(s.n,5)][rBucket(s.m)]++});const gm=Math.max(1,...grid.flat());
 let list=cs.filter(c=>!(c.snooze&&c.snooze>t));const f=ST.rf;
 if(ST.rcell){const[fi,ri]=ST.rcell;list=list.filter(c=>{const s=S[c.id];return 5-Math.min(s.n,5)===fi&&rBucket(s.m)===ri})}
 else if(f==='sugeridos')list=list.filter(c=>['Toca recompra','Por vencer'].includes(S[c.id].status)&&!S[c.id].open&&S[c.id].m<24);
 else if(f==='frecuentes')list=list.filter(c=>S[c.id].freq);else if(f==='dormidos')list=list.filter(c=>S[c.id].status==='Dormido');else if(f==='oro')list=list.filter(c=>['Oro','Plata'].includes(S[c.id].level));
 list.sort((a,b)=>S[b.id].score-S[a.id].score||(S[a.id].dn-S[b.id].dn));
 const cnt=k=>({sugeridos:cs.filter(c=>['Toca recompra','Por vencer'].includes(S[c.id].status)&&!S[c.id].open&&S[c.id].m<24).length,frecuentes:cs.filter(c=>S[c.id].freq).length,oro:cs.filter(c=>['Oro','Plata'].includes(S[c.id].level)).length,dormidos:cs.filter(c=>S[c.id].status==='Dormido').length,todos:cs.length})[k];
 const lim=ST.rlim||40;
 return `<div class="grid" style="grid-template-columns:1.1fr 1fr;margin-bottom:16px">
 <div class="card"><h3>Mapa de clientes: frecuencia × tiempo desde el último servicio<span class="r mut sm">clic en una celda para filtrar</span></h3>
 <table class="heat" style="width:100%"><tr><th></th>${RB.map(r=>`<th>${r}</th>`).join('')}</tr>${grid.map((row,i)=>`<tr><th>${FB[i]} serv.</th>${row.map((v,j)=>{const a=v/gm,sel=ST.rcell&&ST.rcell[0]===i&&ST.rcell[1]===j;const hue=j<=1?'20,184,166':j===2?'245,158,11':'239,68,68';return `<td onclick="ST.rcell=${sel?'null':`[${i},${j}]`};ST.rlim=40;render()" style="background:rgba(${hue},${.12+a*.75});color:${a>.55?'#fff':'#0f172a'};${sel?'outline:3px solid #0f172a':''}">${v}</td>`}).join('')}</tr>`).join('')}</table>
 <div class="sm mut" style="margin-top:8px">Arriba a la izquierda: tus mejores clientes. Abajo a la derecha: clientes de un solo servicio que se enfriaron.</div></div>
 <div class="card"><h3>Cómo se calcula</h3><div class="sm" style="line-height:1.7">
 <b>Puntaje (0-100)</b> = frecuencia (hasta 40) + recencia (hasta 35) + valor histórico (hasta 25).<br>
 ${['Oro','Plata','Bronce','Básico'].map(l=>`${lvB(l)} `).join('')} 70+ · 50-69 · 30-49 · &lt;30<br>
 <b>Próxima recompra</b> = último servicio + intervalo recomendado (colchones, muebles y tapetes cada ${DB.settings.interval.Colchones} meses; se cambia en Ajustes).<br>
 ${stB('Por vencer')} vence en ${DB.settings.window} días o menos · ${stB('Toca recompra')} ya pasó la fecha · ${stB('Dormido')} +24 meses.<br>

 <div style="margin-top:10px">${hbars(['Activo','Por vencer','Toca recompra','Dormido'].map(l=>({l,v:cs.filter(c=>S[c.id].status===l).length,c:STATUS[l]})))}</div></div></div>
 <div class="row" style="margin-bottom:12px"><div class="seg">${[['sugeridos','Sugeridos ahora'],['oro','Oro y Plata'],['frecuentes','Frecuentes'],['dormidos','Dormidos'],['todos','Todos']].map(([k,l])=>`<button class="${!ST.rcell&&f===k?'on':''}" onclick="ST.rf='${k}';ST.rcell=null;ST.rlim=40;render()">${l} (${cnt(k)})</button>`).join('')}</div>
 ${ST.rcell?`<span class="pill">Celda: ${FB[ST.rcell[0]]} serv. · ${RB[ST.rcell[1]]}</span><button class="btn sm" onclick="ST.rcell=null;render()">Quitar</button>`:''}<span class="sp"></span><span class="mut">${list.length} clientes</span></div>

function contactRecompra(id){const c=C(id);if(!c.phone)return toast('No tiene celular','err');if(!lawCheck(c,'recordatorio de recompra'))return;
 window.open(waUrl(c.phone,fillTpl(DB.settings.tplRecompra,c)),'_blank');c.lastMkt=nowISO();logAct(id,'WhatsApp','Recordatorio de recompra enviado');save();render();
 if(!$('modal').classList.contains('hidden'))openContact(id)}
function snooze(id){const c=C(id);c.snooze=addDays(today(),30);save();render();toast('Oculto hasta el '+fd(c.snooze))}

function metaWeeks(ym){const st=monday(addDays(ym+'-01',-8));return META_SEMANAS.map((p,i)=>({ini:addDays(st,i*7),fin:addDays(st,i*7+6),p}))}
const metaM=v=>'$'+(Math.round((+v||0)/1e5)/10).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+' M';

function metaHist(){const S0=stats();if(MH&&MHref===S0)return MH;
 const rev={},nuevo={},first={};
 const V={};DB.services.forEach(s=>{if(!countsAsService(s)||!(+s.value>0))return;const k=s.cid+'|'+s.date;V[k]=V[k]||{cid:s.cid,date:s.date,v:0};V[k].v+=+s.value});
 Object.values(V).sort((a,b)=>a.date<b.date?-1:1).forEach(x=>{const ym=x.date.slice(0,7);rev[ym]=(rev[ym]||0)+x.v;if(!first[x.cid]){first[x.cid]=1;nuevo[ym]=(nuevo[ym]||0)+x.v}});
 const cur=today().slice(0,7),last12=[];for(let i=12;i>=1;i--)last12.push(ymAdd(cur,-i));
 const base=sum(last12,m=>rev[m]||0)/12,nuevos=sum(last12,m=>nuevo[m]||0)/12;
 const y0=+cur.slice(0,4),idx={};
 for(let m=1;m<=12;m++){const r=[];for(let y=y0-5;y<y0;y++){const ms=[...Array(12)].map((_,i)=>rev[y+'-'+pad(i+1)]||0);if(ms.filter(Boolean).length<10)continue;const avg=sum(ms,x=>x)/12;if(avg)r.push((rev[y+'-'+pad(m)]||0)/avg)}idx[m]=r.length?sum(r,x=>x)/r.length:1}
 MH={rev,base,nuevos,idx};MHref=S0;return MH}

 const r5=v=>Math.round(v/5e5)*5e5;const o={ix,piso:r(piso)};for(const k in META_ESC)o[k]=k==='piso'?r(piso):r5(piso*(1+META_ESC[k].g));const c=metaCfg(ym);o.esc=c.esc;o.monto=+c.monto||(c.esc==='otro'?o.meta:o[c.esc]||o.meta);o.fija=!!c.monto;o.nuevos=r(h.nuevos*ix);return o}
function metaPools(ym){const S=stats(),t=today(),open=new Set(DB.opps.filter(o=>OPEN.includes(o.stage)).map(o=>o.cid)),lim=addDays(t,-45);

 const aniv=DB.camps.find(c=>c.type==='aniv');let bset=new Set();
 if(aniv){if(ym===t.slice(0,7))aniv.members.filter(m=>(m.added||'').slice(0,7)===ym&&['Pendiente','Contactado','Respondió'].includes(m.status)).forEach(m=>bset.add(m.cid));
  else if(ym>t.slice(0,7)){const tmp={...aniv,members:[]};anivElig(tmp,ym+'-01').forEach(c=>bset.add(c.id))}}
 const P={};META_POOLS.forEach(p=>P[p.k]={...p,list:[],tk:[]});
 const lastV=s=>{const v={};s.sv.forEach(x=>v[x.date]=(v[x.date]||0)+(+x.value||0));const a=Object.entries(v).filter(x=>x[1]>0).sort();return a.length?a[a.length-1][1]:0};
 DB.contacts.forEach(c=>{const s=S[c.id];if(!s||!s.n||c.optOut||!c.phone||open.has(c.id))return;let k='';

function metaPlan(ym){const mo=metaMontos(ym),P=metaPools(ym),gap=Math.max(0,mo.monto-mo.nuevos),rows=[];
 const capR=p=>p.cap*p.cnt*p.c2o*p.win*p.ticket;
 const B=P.B,rB=Math.min(gap,capR(B));let rem=gap-rB,ov=0;const R={B:rB,A:0,C:0,D:0,E:0};
 ['A','C','D'].forEach(k=>{const p=P[k],want=rem*p.share,mx=capR(p);R[k]=Math.min(want,mx);ov+=want-R[k]});
 ['D','A','C','E'].forEach(k=>{if(ov<=0)return;const p=P[k],mx=capR(p),room=mx-R[k];if(room>0){const add=Math.min(room,ov);R[k]+=add;ov-=add}});
 META_POOLS.forEach(({k})=>{const p=P[k],r=R[k];if(!r&&k==='E')return;const cierres=r/p.ticket,opps=cierres/p.win,cont=opps/p.c2o;
  rows.push({...p,r,cierres,opps,cont,pipe:opps*p.ticket})});
 const T={cont:sum(rows,x=>x.cont),opps:sum(rows,x=>x.opps),cierres:sum(rows,x=>x.cierres),pipe:sum(rows,x=>x.pipe),r:sum(rows,x=>x.r),n:sum(rows,x=>x.cnt)};
 T.win=T.pipe?T.r/T.pipe:.4;T.cob=gap?T.pipe/gap:0;

function metaTrack(ym,plan){const t=today(),fin=ymEnd(ym),W=metaWeeks(ym),ini=W[0].ini;

 const op=DB.opps.filter(o=>OPEN.includes(o.stage)&&(o.svcDate?o.svcDate.slice(0,7)===ym:(o.created||'').slice(0,10)>=ini&&(o.created||'').slice(0,10)<=fin));
 const pipe=sum(op,o=>+o.value||0),pond=sum(op,o=>(+o.value||0)*SMAP[o.stage].p);
 const dias=Math.max(1,daysDiff(ym+'-01',fin)+1),corr=t<ym+'-01'?0:t>fin?dias:daysDiff(ym+'-01',t)+1,resto=1-corr/dias;
 const falta=Math.max(0,plan.mo.monto-vendido),porGestion=Math.max(0,falta-plan.mo.nuevos*resto);
 const cob=porGestion?pipe/porGestion:pipe?9:0,obj=plan.T.win?1/plan.T.win:2.4;
 const sem=W.map(w=>({...w,oppsHecho:DB.opps.filter(o=>{const d=(o.created||'').slice(0,10);return d>=w.ini&&d<=w.fin}).length,
  contHecho:DB.acts.filter(a=>{const d=(a.date||'').slice(0,10);return d>=w.ini&&d<=w.fin&&['WhatsApp','Correo','Llamada'].includes(a.type)}).length,
  oppsObj:Math.ceil(plan.T.opps*w.p),contObj:Math.ceil(plan.T.cont*w.p),actual:t>=w.ini&&t<=w.fin}));
 return {vendido,pipe,pond,falta,porGestion,cob,obj,sem,nOpen:op.length,corr,dias}}

 </div>

function metaEsc(k){const M=DB.settings.metas=DB.settings.metas||{};const ym=ST.metaYm;M[ym]={esc:k};M[ym].monto=metaMontos(ym)[k];save();render()}
// La meta queda fija al escogerla o cuando empieza el mes (así no cambia aunque se mueva el promedio)
function metaFijar(){const ym=today().slice(0,7),M=DB.settings.metas=DB.settings.metas||{};if(M[ym]&&M[ym].monto)return;const mo=metaMontos(ym);M[ym]={esc:mo.esc,monto:mo.monto};save()}
function metaOtro(){const v=prompt('Meta de '+ymName(ST.metaYm)+' en pesos (por ejemplo 20000000):',String(metaMontos(ST.metaYm).monto));if(v==null)return;const n=+String(v).replace(/[^\d]/g,'');if(!n)return toast('Escribe una cifra','err');
 const M=DB.settings.metas=DB.settings.metas||{};M[ST.metaYm]={esc:'otro',monto:n};save();render()}
function metaCrear(ym,k){const plan=metaPlan(ym),r=plan.rows.find(x=>x.k===k);if(!r)return;const want=Math.ceil(r.cont);
 const usados=new Set();DB.camps.filter(c=>c.type==='meta'&&c.metaYm===ym).forEach(c=>c.members.forEach(m=>usados.add(m.cid)));
 let cp=metaCamp(ym,k);const nuevo=!cp;
 if(!cp){const W=metaWeeks(ym);cp={id:uid(),code:k+'·'+MES[+ym.slice(5,7)-1],name:r.n+' · '+MES_N[+ym.slice(5,7)-1],type:'meta',metaYm:ym,metaPool:k,channel:'WhatsApp',keyword:'',discount:0,start:W[0].ini,end:ymEnd(ym),goal:Math.max(1,Math.round(r.cierres)),rule:{min:0,max:999},color:r.color,members:[],tpl:k==='A'?META_TPL.A:META_TPL.R,notes:'Creada desde Metas para '+ymName(ym)+'. Plan: '+want+' contactos, '+Math.ceil(r.opps)+' oportunidades, '+Math.round(r.cierres)+' cierres, '+metaM(r.r)+'.'};DB.camps.push(cp)}
 const falta=want-cp.members.length;let n=0;
 r.list.forEach(c=>{if(n>=falta||usados.has(c.id)||cp.members.some(m=>m.cid===c.id))return;cp.members.push({cid:c.id,status:'Pendiente',added:today()});n++});
 save();toast(`${nuevo?'Campaña creada':'Campaña actualizada'}: ${n} clientes en «${cp.name}»`,'ok');go('campanas',{camp:cp.id,cfil:'',cpage:0})}

const habil=d=>{const x=D(d);return x.getDay()!==0&&!isHoliday(x)};
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
function metaVentana(){const t=today(),c=t.slice(0,7);for(const ym of [ymAdd(c,1),c]){const W=metaWeeks(ym);if(t>=W[0].ini&&t<=W[3].fin)return {ym,W}}return null}
function metaTareas(){const t=today(),v=metaVentana(),out={items:[],dias:[],ym:null,prox:null,total:0,hechoHoy:0};
 const nx=ymAdd(t.slice(0,7),1),Wn=metaWeeks(nx),dIni=daysDiff(t,Wn[0].ini);
 if(!v&&dIni>0&&dIni<=7)out.prox={ym:nx,ini:Wn[0].ini,falta:['A','C','D'].filter(k=>!metaCamp(nx,k))};
 out.seg=DB.rems.filter(r=>!r.done&&r.date<=t).length;out.oppsSin=DB.opps.filter(o=>OPEN.includes(o.stage)&&!DB.rems.some(r=>r.oppId===o.id&&!r.done)).length;
 if(!v)return out;const {ym,W}=v;out.ym=ym;const w=W.find(x=>t>=x.ini&&t<=x.fin),plan=metaPlan(ym);
 const dl=[];for(let d=t;d<=w.fin;d=addDays(d,1))if(habil(d))dl.push(d);const nd=Math.max(1,dl.length);
 plan.rows.forEach(r=>{const cp=metaCamp(ym,r.k);const obj=Math.ceil(r.cont*w.p);
  if(r.k==='B'){if(!cp||t.slice(0,7)!==ym)return;const pend=cp.members.filter(m=>(m.added||'').slice(0,7)===ym&&m.status==='Pendiente').length,hoy=cp.members.filter(m=>m.lastContact===t).length;
   if(pend+hoy)out.items.push({k:'B',n:r.n,bg:r.bg,tx:r.tx,cp,hoy:Math.min(pend+hoy,Math.ceil((pend+hoy)/Math.max(1,nd))),hecho:hoy,sem:null});return}
  if(!obj)return;
  if(!cp){if(W.indexOf(w)<=1)out.items.push({k:r.k,n:r.n,bg:r.bg,tx:r.tx,crear:true,obj});return}
  const semAntes=cp.members.filter(m=>m.lastContact&&m.lastContact>=w.ini&&m.lastContact<t).length,hoyH=cp.members.filter(m=>m.lastContact===t).length;
  const pend=cp.members.filter(m=>m.status==='Pendiente').length;
  const meta=Math.min(pend+hoyH,Math.ceil(Math.max(0,obj-semAntes)/nd));
  if(meta||hoyH)out.items.push({k:r.k,n:r.n,bg:r.bg,tx:r.tx,cp,hoy:meta,hecho:hoyH,sem:{obj,hecho:semAntes+hoyH},sinClientes:!pend&&!hoyH});
  dl.slice(1).forEach((d,i)=>{const rest=Math.max(0,obj-semAntes-Math.max(meta,hoyH));const x=out.dias[i]=out.dias[i]||{d,n:0};x.n+=Math.ceil(rest/Math.max(1,nd-1))})});
 out.total=sum(out.items,x=>x.hoy||0);out.hechoHoy=sum(out.items,x=>x.hecho||0);
 out.dias.unshift({d:t,n:out.total,hoy:1});return out}
function tareasCard(){const T=metaTareas(),t=today();

 let h='';

 T.items.forEach(x=>{if(x.crear){h+=`<div class="row" style="padding:8px 0;border-bottom:1px solid #f1f5f9"><span class="badge" style="background:${x.bg};color:${x.tx}">${x.k}</span><span class="sp">Crea la campaña <b>${esc(x.n)}</b> para empezar a contactar (${x.obj} clientes esta semana)</span><button class="btn sm pri" onclick="metaCrear('${T.ym}','${x.k}')">Crear campaña</button></div>`;return}
  const ok=x.hecho>=x.hoy&&x.hoy>0;
  h+=`<div class="row" style="padding:8px 0;border-bottom:1px solid #f1f5f9"><span class="badge" style="background:${x.bg};color:${x.tx}">${x.k}</span><div class="sp" style="min-width:0">${ok?'✅ ':''}Contacta <b>${x.hoy} cliente${x.hoy===1?'':'s'}</b> de <b>${esc(x.n)}</b><div class="sm mut">Hoy llevas ${x.hecho} de ${x.hoy}${x.sem?` · semana ${x.sem.hecho} de ${x.sem.obj}`:''}${x.sinClientes?' · ya no quedan pendientes: agrega más desde Metas':''}</div></div><button class="btn sm wa" onclick="go('campanas',{camp:'${x.cp.id}',cfil:'Pendiente',cpage:0})">Contactar</button></div>`});
 if(T.seg)h+=`<div class="row" style="padding:8px 0;border-bottom:1px solid #f1f5f9"><span class="badge" style="background:#fef3c7;color:#92400e">⏰</span><span class="sp">Haz <b>${T.seg} seguimiento${T.seg>1?'s':''}</b> pendiente${T.seg>1?'s':''} (cotizaciones y recordatorios de hoy o vencidos)</span><button class="btn sm" onclick="go('recordatorios')">Ver</button></div>`;
 if(T.oppsSin)h+=`<div class="row" style="padding:8px 0"><span class="badge" style="background:#fee2e2;color:#991b1b">!</span><span class="sp"><b>${T.oppsSin} oportunidad${T.oppsSin>1?'es':''}</b> sin próximo seguimiento: ponle fecha para que no se enfríe${T.oppsSin>1?'n':''}</span><button class="btn sm" onclick="go('pipeline')">Ver</button></div>`;
 const dias=T.dias.length>1?`<div class="row" style="gap:6px;margin-top:10px">${T.dias.map(x=>`<span class="chip" style="${x.hoy?'background:var(--pl);color:#064e48;font-weight:700':''}">${x.hoy?'Hoy':DIAS[D(x.d).getDay()]+' '+D(x.d).getDate()}: ${x.n}</span>`).join('')}<span class="sm mut">mensajes por día para cumplir la semana</span></div>`:'';
 const tot=T.total?`<span class="r sm">${T.hechoHoy>=T.total?'✅ ':''}${T.hechoHoy} de ${T.total} mensajes hoy</span>`:'';
 return `<div class="card" style="margin-bottom:16px;border-color:#99f6e4"><h3>Tareas de hoy${T.ym?` · siembra de ${MES_N[+T.ym.slice(5,7)-1]}`:''}${tot}</h3>${h}${dias}</div>`}

function autoMergeSameName(){const S0=new Set(DB.services.filter(countsAsService).map(s=>s.cid));const byK={};let mg=0;
 DB.contacts.forEach(c=>{const k=normName(c.name);if(k&&k.split(' ').length>=2&&!/^cliente \d/.test(k))(byK[k]=byK[k]||[]).push(c)});
 for(const k in byK){const l=byK[k];if(l.length<2)continue;const keep=l.filter(c=>S0.has(c.id));if(keep.length!==1)continue;
  l.filter(c=>c!==keep[0]&&!S0.has(c.id)).forEach(c=>{mergeContacts(keep[0].id,c.id);mg++})}
 return mg}
function levD(a,b){if(Math.abs(a.length-b.length)>3)return 9;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]!==b[j-1]));p=c}return p[b.length]}
function findDupPairs(){const S=stats(),ign=new Set(DB.meta.notDup||[]),by={},out=[];
 DB.contacts.forEach(c=>{const t=normName(c.name).split(' ');if(t.length<2||/^cliente$/.test(t[0]))return;(by[t[0].slice(0,4)]=by[t[0].slice(0,4)]||[]).push([c,t])});
 for(const g of Object.values(by)){for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const[a,ta]=g[i],[b,tb]=g[j];
  if(a.phone&&b.phone&&a.phone!==b.phone&&!(a.altPhones||[]).includes(b.phone)&&!(b.altPhones||[]).includes(a.phone))continue;
  const ka=ta.join(' '),kb=tb.join(' ');const key=[a.id,b.id].sort().join('|');if(ign.has(key))continue;
  const la=ta[ta.length-1],lb=tb[tb.length-1],sameFirst=levD(ta[0],tb[0])<=1,sameLast=levD(la,lb)<=1||(la.length>3&&tb.slice(1).includes(la))||(lb.length>3&&ta.slice(1).includes(lb)),secOk=!(ta.length>=3&&tb.length>=3)||levD(ta[1],tb[1])<=1||ta[1]===lb||tb[1]===la;
  if((sameFirst&&sameLast&&secOk)||levD(ka,kb)<=2){const sa=S[a.id].n,sb=S[b.id].n;out.push(sa>=sb?[a,b,key]:[b,a,key])}}}
 return out.sort((x,y)=>(S[y[0].id].n+S[y[1].id].n)-(S[x[0].id].n+S[x[1].id].n))}
function dupReview(){const S=stats(),P=findDupPairs();const row=([a,b,key])=>{const d=c=>`<b>${esc(c.name)}</b><div class="sm mut">${esc(c.phone||'sin celular')} · ${S[c.id].n} servicio${S[c.id].n===1?'':'s'}${S[c.id].last?' · último '+fd(S[c.id].last):''}</div>`;
  return `<tr><td>${d(a)}</td><td>${d(b)}</td><td style="white-space:nowrap"><button class="btn sm pri" onclick="dupMerge('${a.id}','${b.id}')">Unir</button> <button class="btn sm" onclick="dupIgnore('${key}')">No son la misma</button></td></tr>`};
 openModal(`<h2>Posibles duplicados (${P.length})</h2><p class="sm mut">Clientes con nombres casi iguales y sin celulares que los contradigan. Al unir, se conserva el de la izquierda (el que tiene más servicios) y se guardan los datos del otro.</p>
 ${P.length?`<div style="max-height:60vh;overflow:auto"><table class="t"><thead><tr><th>Se conserva</th><th>Se une</th><th></th></tr></thead><tbody>${P.slice(0,150).map(row).join('')}</tbody></table></div>`:'<div class="empty">No hay posibles duplicados pendientes</div>'}
 <div class="mfoot"><button class="btn" onclick="closeModal();render()">Cerrar</button></div>`,true)}

function mergeContacts(keepId,goneId){const a=C(keepId),b=C(goneId);(DB.meta.msMerged=DB.meta.msMerged||{})[goneId]=a.name+' ('+keepId+')';
 a.aliases=[...new Set([...(a.aliases||[]),b.name,...(b.aliases||[])])];
 if(!a.phone&&b.phone)a.phone=b.phone;else if(b.phone&&b.phone!==a.phone)a.altPhones=[...new Set([...(a.altPhones||[]),b.phone])];
 (b.altPhones||[]).forEach(p=>{if(p!==a.phone)a.altPhones=[...new Set([...(a.altPhones||[]),p])]});
 if(!a.email&&b.email)a.email=b.email;else if(b.email&&b.email!==a.email)a.altEmails=[...new Set([...(a.altEmails||[]),b.email])];
 ['city','localidad','barrio','address'].forEach(k=>{if(!a[k]&&b[k])a[k]=b[k]});
 if(b.notes)a.notes=(a.notes?a.notes+'\n':'')+b.notes;a.rating=Math.max(a.rating||0,b.rating||0)||undefined;a.optOut=a.optOut||b.optOut;
 if(b.lastMkt&&(!a.lastMkt||b.lastMkt>a.lastMkt))a.lastMkt=b.lastMkt;
 ['services','opps','acts','rems'].forEach(k=>DB[k].forEach(x=>{if(x.cid===goneId)x.cid=keepId}));
 DB.camps.forEach(cp=>{const mb=cp.members.find(m=>m.cid===goneId);if(mb){if(cp.members.some(m=>m.cid===keepId))cp.members=cp.members.filter(m=>m!==mb);else mb.cid=keepId}});
 logAct(keepId,'Nota','Unido con '+b.name+(b.phone?' ('+b.phone+')':''));DB.contacts=DB.contacts.filter(x=>x.id!==goneId)}

const FIELDS=[['name','Nombre'],['phone','Celular'],['email','Correo'],['date','Fecha (servicio / solicitud)'],['value','Valor / total'],['status','Estado de pago'],['cats','Servicios (categorías)'],['items','Piezas / detalle'],['city','Ciudad'],['localidad','Localidad'],['barrio','Barrio'],['address','Dirección'],['campaign','Campaña / grupo'],['notes','Observaciones']];
const SENSITIVE=/c[eé]dula|nacimiento|alerg|s[ií]ntoma|covid|salud|documento|identificaci/i;
const GUESS={name:[/nombre|cliente|raz[oó]n social/i,/t[eé]cnico|usuario/i],phone:[/celular|tel[eé]fono|whats|m[oó]vil|phone/i],email:[/e-?mail|correo/i],date:[/fecha.*servicio|fecha|timestamp|marca temporal|date|[uú]ltimo servicio/i,/nacim|pago|vence|registro|env[ií]o|contacto/i],value:[/total|valor|monto|precio/i,/pagado|unit|descuento|recargo/i],status:[/estado/i],cats:[/^servicios?$|servicios solicitados|categor|tipo de servicio/i],items:[/piezas|detalle|descripci|[ií]tems/i],city:[/ciudad|municipio/i],localidad:[/localidad/i],barrio:[/barrio/i],address:[/direcci/i],campaign:[/campa[nñ]a|grupo|segmento/i],notes:[/observ|nota/i]};
function guessMap(headers){const map={};FIELDS.forEach(([k])=>{const[re,neg]=GUESS[k];const i=headers.findIndex(h=>h&&!SENSITIVE.test(h)&&re.test(h)&&!(neg&&neg.test(h)));map[k]=i});return map}
function guessMode(h){const j=h.join('|').toLowerCase();if(/estado/.test(j)&&/total|valor/.test(j)&&/cliente|celular/.test(j))return 'cartera';if(/medio de pago|archivo/.test(j)&&/detalle/.test(j)&&/valor|monto/.test(j))return 'historial';if(/timestamp|marca temporal/.test(j)&&/miembros|servicios|localidad/.test(j))return 'form';if(/estado/.test(j)&&/total|valor/.test(j))return 'cartera';if(/campa|grupo|segmento/.test(j))return 'lista';return 'contactos'}

 <div class="card"><h3>De dónde salen los datos</h3><div class="sm" style="line-height:1.7">

 En Google Sheets: Archivo → Descargar → Microsoft Excel (.xlsx). Puedes reimportar las veces que quieras: no se duplican.<br>
 <span class="mut">Las columnas de cédula, fecha de nacimiento y salud se ignoran siempre.</span></div></div></div>`;
 if(I){const sh=I.sheets[I.si],rows=sh.rows,hr=I.hr,headers=(rows[hr]||[]).map(x=>String(x??'').trim());
